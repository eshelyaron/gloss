name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to release under
        required: true
  push:
    tags:
      - 'v*'

jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          gh release create "$tag" \
            --title "gloss $tag" \
            --notes "Pre-built dictionary databases." \
            2>/dev/null || true

  build-db:
    needs: create-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - lang: en
            url: https://kaikki.org/dictionary/English/kaikki.org-dictionary-English.jsonl
          - lang: nl
            url: https://kaikki.org/dictionary/Dutch/kaikki.org-dictionary-Dutch.jsonl
          - lang: fr
            url: https://kaikki.org/dictionary/French/kaikki.org-dictionary-French.jsonl
          - lang: de
            url: https://kaikki.org/dictionary/German/kaikki.org-dictionary-German.jsonl
          - lang: it
            url: https://kaikki.org/dictionary/Italian/kaikki.org-dictionary-Italian.jsonl
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Download JSONL
        run: |
          mkdir -p data
          curl -L -o data/${{ matrix.lang }}.jsonl ${{ matrix.url }}

      - name: Build database
        run: make data/${{ matrix.lang }}.db

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          gh release upload "$tag" data/${{ matrix.lang }}.db --clobber
